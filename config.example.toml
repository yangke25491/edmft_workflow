# Project-local calculation configuration.
# Put this file at PROJECT/config.toml.
# root_dir = "." means the directory containing this config file.
#
# Machine-specific software paths, MPI/MKL/runtime setup, and scheduler
# allocation semantics belong in site.toml (see site.example.toml).
#
# Scientific native inputs can be kept in PROJECT/inputs/:
#   inputs/params.dat
#   inputs/maxent_params.dat
#   inputs/CASE.klist_band
# Native files take priority over generated fallbacks.

[project]
case = "01"
root_dir = "."
scratch_dir = "dft/tmp"
dmft_scratch_dir = "dmft/tmp"

# Frequently tuned execution command.  Environment/path resolution comes from
# site.toml, so this can stay portable between machines.
[dft]
run_command = "run_lapw -p -cc 0.0001 -ec 0.0001 -i 100"

[dmft]
# Optional full command override.  Leave commented to use site software.python
# + site software.edmft_root/run_dmft.py.
# run_command = "python run_dmft.py"

[dmft_params]
solver = "CTQMC"
DCs = "nominal"
max_dmft_iterations = 1
max_lda_iterations = 100

[impurity0]
# Prefer PROJECT/inputs/params.dat. Fill these only for generated fallback.
# exe = "ctqmc"
# U = 8.0
# J = 0.8
# beta = 100.0
# nf0 = 5.0
# M = 5000000

[dmft_prepare]
initial_sigma = "szero"
szero_args = []

[convergence]
max_dn = 0.005
outer_drift = 0.005
block_postprocess = true

[fermi]
# Warning-only consistency tolerance. Fermi-level warnings never block runs.
tolerance_eV = 1e-6

[post]
impurity = 1
average_last = 3

[maxent]
# prepare-maxent writes dmft/maxent/sig.inpx and maxent_params.dat.
# MPI implementation/path belongs in site.toml [mpi.maxent].
# Optional full command override (if set, include the launcher yourself):
# run_command = "mpirun -np 2 python /path/to/maxent_run.py sig.inpx"

[dos]
nomega = 200
wmin = -3.0
wmax = 1.0

[band]
nomega = 200
wmin = -6.0
wmax = 6.0
klist_source = "@wien:fcc.klist"

# DOS and band are foreground MPI postprocessing. These are calculation-level
# choices and therefore stay in config.toml.
[foreground]
dos_np = 1
band_np = 1

[analysis]
z_fit_points = 4

[plot]
# Default figure output: "png", "pdf", or "both".
# analyze/run plots --format overrides this for one invocation.
format = "both"
orbital_labels = ["eg", "t2g"]
cdos_labels = ["Total DOS", "Mn-d"]
dos_xmin = -3.0
dos_xmax = 1.0
akw_intensity = 0.97
drop_klabels = ["LAMBDA", "DELTA", "Z"]

# PBS resources are calculation choices and remain project-local. Scheduler
# syntax/semantics are supplied by site.toml.
[pbs]
queue = "batch"
nodes = 1
ppn = 1
walltime = "04:00:00"

[pbs_dft]
job_name = "DFT"
ppn = 1
walltime = "04:00:00"
mem = ""

[pbs_dmft]
job_name = "DMFT"
ppn = 1
walltime = "04:00:00"
mem = ""

[pbs_maxent]
job_name = "MaxEnt"
ppn = 1
walltime = "04:00:00"
mem = ""
