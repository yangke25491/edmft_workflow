# MnO calculation example. Copy this file into the calculation root before use.
# Machine paths/MPI/scheduler behavior belong in site.toml; see ../../site.example.toml.

[project]
case = "01"
root_dir = "."
scratch_dir = "dft/tmp"
dmft_scratch_dir = "dmft/tmp"

[commands]
# Optional helper-command overrides. Leave unset to use the absolute software
# paths from site.toml.
# dmft_copy = "dmft_copy.py"
# szero = "szero.py"
# saverage = "saverage.py"

[dft]
run_command = "run_lapw -p -cc 0.0001 -ec 0.0001 -i 100"

[dmft]
# Optional frequently tuned full command override.
# run_command = "python run_dmft.py"

[dmft_params]
solver = "CTQMC"
DCs = "nominal"
max_dmft_iterations = 1
max_lda_iterations = 100

[impurity0]
# Prefer inputs/params.dat. Fill only when using generated fallback.
# exe = "ctqmc"
# U = 8.0
# J = 0.8
# beta = 100.0
# nf0 = 5.0
# M = 5000000

[dmft_prepare]
initial_sigma = "szero"
szero_args = []

[convergence]
max_dn = 0.005
outer_drift = 0.005
block_postprocess = true

[fermi]
tolerance_eV = 1e-6

[post]
impurity = 1
average_last = 5

[maxent]
# MPI/runtime belongs to site.toml [mpi.maxent] / [runtime.maxent].
# Optional full-command override:
# run_command = "mpirun -np 2 python /path/to/maxent_run.py sig.inpx"

[dos]
nomega = 200
wmin = -3.0
wmax = 1.0

[band]
nomega = 200
wmin = -6.0
wmax = 6.0
klist_source = "@wien:fcc.klist"

[foreground]
dos_np = 8
band_np = 8

[analysis]
z_fit_points = 4

[plot]
format = "both"
orbital_labels = ["eg", "t2g"]
cdos_labels = ["Total DOS", "Mn-d"]
dos_xmin = -3.0
dos_xmax = 1.0
akw_intensity = 0.97
drop_klabels = ["LAMBDA", "DELTA", "Z"]

# Requested resources stay with the calculation. Scheduler syntax and resource
# interpretation are supplied by site.toml.
[pbs]
queue = "batch"
nodes = 1
ppn = 1
walltime = "04:00:00"

[pbs_dft]
job_name = "MnO_DFT"
ppn = 64
walltime = "168:00:00"
mem = ""

[pbs_dmft]
job_name = "MnO_DMFT"
ppn = 32
walltime = "168:00:00"
mem = ""

[pbs_maxent]
job_name = "MnO_MaxEnt"
ppn = 2
walltime = "24:00:00"
mem = ""
