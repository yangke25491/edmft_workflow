# MnO site example. Copy this file into the MnO calculation root before use.
# Project paths are relative to the location of config.toml.

[project]
case = "01"
root_dir = "."
scratch_dir = "dft/tmp"
dmft_scratch_dir = "dmft/tmp"

[environment]
wienroot = "/home/kyang/apps/edmft/wien2k"
edmft_root = "/home/kyang/apps/edmft/eDMFT/bin"
python = "/home/kyang/miniforge3/envs/edmft/bin/python"
python_bin_dir = "/home/kyang/miniforge3/envs/edmft/bin"
intel_root = "/opt/intel2019/compilers_and_libraries_2019.4.243"
intel_arch = "intel64"
fftw_lib = "/opt/fftw-3.3.10/lib"
ulimit_stack = "unlimited"
ulimit_core = "unlimited"

[environment_extra]
OMP_NUM_THREADS = "1"
MKL_NUM_THREADS = "1"
I_MPI_HYDRA_BOOTSTRAP = "ssh"
I_MPI_FABRICS = "shm"

[parallel]
mpi_launcher = "/opt/intel2019/compilers_and_libraries_2019.4.243/linux/mpi/intel64/bin/mpirun"
mpi_np_flag = "-np"
mpi_extra_args = []
write_mpi_prefix2 = true
foreground_ranks = 1
dft_ranks = "allocation"
dmft_ranks = "allocation"
maxent_ranks = "allocation"
dos_ranks = "allocation"
band_ranks = "allocation"
wien_machines_mode = "single_node_compact"
dmft_wien_machines = false

[commands]
dmft_copy = "dmft_copy.py"
szero = "szero.py"
saverage = "saverage.py"
maxent = "maxent_run.py"
x_dmft = "x_dmft.py"
wien_x = "x"

[dft]
run_command = "run_lapw -p -cc 0.0001 -ec 0.0001 -i 100"

[dmft]
# Omit run_command to let workflow use environment.python + edmft_root/run_dmft.py.

# Fill these from the already validated MnO params.dat before prepare-dmft.
[dmft_params]
solver = "CTQMC"
DCs = "nominal"
max_dmft_iterations = 1
max_lda_iterations = 100

[impurity0]
# exe = "ctqmc"
# U = ...
# J = ...
# beta = ...
# nf0 = ...
# M = ...

[dmft_prepare]
initial_sigma = "szero"
szero_args = []

[convergence]
max_dn = 0.005
outer_drift = 0.005
block_postprocess = true

[maxent]
impurity = 1
average_last = 5

[maxent_params]
statistics = "fermi"
Ntau = 300
L = 20.0
x0 = 0.005
bwdth = 0.004
Nw = 300
gwidth = 30.0
idg = 1
deltag = 0.004
Asteps = 4000
alpha0 = 1000
min_ratio = 0.001
iflat = 1
Nitt = 1000
Nr = 0
Nf = 40

[dos]
nomega = 200
wmin = -3.0
wmax = 1.0

[band]
nomega = 200
wmin = -6.0
wmax = 6.0
klist_source = "@wien:fcc.klist"

[plot]
orbital_labels = ["eg", "t2g"]
cdos_labels = ["Total DOS", "Mn-d"]
dos_xmin = -3.0
dos_xmax = 1.0
akw_intensity = 0.97
drop_klabels = ["LAMBDA", "DELTA", "Z"]

[pbs]
qsub = "qsub"
queue = "batch"
nodes = 1
ppn = 1
walltime = "04:00:00"

[pbs_dft]
job_name = "MnO"
ppn = 64
walltime = "9999:00:00"
mem = ""

[pbs_dmft]
job_name = "MnO"
ppn = 33
walltime = "220:00:00"
mem = ""

[pbs_maxent]
job_name = "MnO_MaxEnt"
ppn = 8
mem = "16gb"
walltime = "04:00:00"

[pbs_dos]
job_name = "MnO_DOS"
ppn = 20
mem = "32gb"
walltime = "04:00:00"

[pbs_band]
job_name = "MnO_BAND"
ppn = 33
mem = "32gb"
walltime = "04:00:00"
