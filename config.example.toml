# Generic project-local configuration.
# Put this file at PROJECT/config.toml.
# root_dir = "." means the directory containing this config file.
#
# Scientific native inputs can be kept in PROJECT/inputs/:
#   inputs/params.dat
#   inputs/maxent_params.dat
#   inputs/CASE.klist_band
# Native files take priority over generated fallbacks.
#
# Environment policy:
# - prepare-* never modifies your login shell and does not source Intel/MKL.
# - lightweight eDMFT helpers are called through the absolute configured Python
#   and eDMFT script paths with only minimal child-process variables.
# - heavy numerical stages run only inside standalone PBS scripts that you
#   inspect and qsub manually.

[project]
case = "01"
root_dir = "."
scratch_dir = "dft/tmp"
dmft_scratch_dir = "dmft/tmp"

[environment]
wienroot = "/home/USER/apps/edmft/wien2k"
edmft_root = "/home/USER/apps/edmft/eDMFT/bin"
python = "/home/USER/miniforge3/envs/edmft/bin/python"
python_bin_dir = "/home/USER/miniforge3/envs/edmft/bin"
intel_root = "/opt/intel2019/compilers_and_libraries_2019.4.243"
intel_arch = "intel64"
fftw_lib = "/opt/fftw-3.3.10/lib"
ulimit_stack = "unlimited"
ulimit_core = "unlimited"

[environment_extra]
I_MPI_HYDRA_BOOTSTRAP = "ssh"
I_MPI_FABRICS = "shm"

[parallel]
# Native WIEN2k/eDMFT MPI stack.
mpi_launcher = "/opt/intel2019/compilers_and_libraries_2019.4.243/linux/mpi/intel64/bin/mpirun"
mpi_np_flag = "-np"
write_mpi_prefix2 = true
wien_machines_mode = "single_node_compact"
dmft_wien_machines = false

[dft]
run_command = "/home/USER/apps/edmft/wien2k/run_lapw -p -cc 0.0001 -ec 0.0001 -i 100"

[dmft_params]
solver = "CTQMC"
DCs = "nominal"
max_dmft_iterations = 1
max_lda_iterations = 100

[impurity0]
# Prefer PROJECT/inputs/params.dat. Fill these only for generated fallback.
# exe = "ctqmc"
# U = 8.0
# J = 0.8
# beta = 100.0
# nf0 = 5.0
# M = 5000000

[dmft_prepare]
initial_sigma = "szero"
szero_args = []

[convergence]
max_dn = 0.005
outer_drift = 0.005
block_postprocess = true

[post]
impurity = 1
average_last = 3

[maxent]
# MaxEnt is Python/mpi4py and therefore has its OWN MPI runtime.
# Do not reuse parallel.mpi_launcher unless mpi4py was built against Intel MPI.
# By default the workflow uses ENV/bin/mpirun next to environment.python,
# which is appropriate when mpi4py in that conda environment was built with
# Open MPI. Override explicitly if needed:
# mpi_launcher = "/home/USER/miniforge3/envs/edmft/bin/mpirun"
mpi_np_flag = "-np"
# prepare-maxent writes dmft/maxent/Sig.average and maxent_params.dat.
# Useful MPI ranks cannot exceed the number of active MaxEnt baths/channels.

[dos]
nomega = 200
wmin = -3.0
wmax = 1.0

[band]
nomega = 200
wmin = -6.0
wmax = 6.0
klist_source = "@wien:fcc.klist"

[analysis]
z_fit_points = 4

[plot]
orbital_labels = ["eg", "t2g"]
cdos_labels = ["Total DOS", "Mn-d"]
dos_xmin = -3.0
dos_xmax = 1.0
akw_intensity = 0.97
drop_klabels = ["LAMBDA", "DELTA", "Z"]

[pbs]
queue = "batch"
nodes = 1
ppn = 1
walltime = "04:00:00"

[pbs_dft]
job_name = "DFT"
ppn = 64
walltime = "9999:00:00"
mem = ""

[pbs_dmft]
job_name = "DMFT"
ppn = 33
walltime = "220:00:00"
mem = ""

[pbs_maxent]
job_name = "MaxEnt"
# Choose no more ranks than active baths/channels. MnO example with nb=2: ppn=2.
ppn = 2
walltime = "04:00:00"
mem = ""

[pbs_dos]
job_name = "DOS"
ppn = 20
walltime = "04:00:00"
mem = ""

[pbs_band]
job_name = "BAND"
ppn = 33
walltime = "04:00:00"
mem = ""
