[project]
case = "01"
dmft_dir = "/home/USER/path/to/converged_dmft"
# All post-processing is created here. Keep this outside the frozen run_dmft.py directory.
work_root = "/home/USER/path/to/converged_dmft/postprocess"

[environment]
wienroot = "/home/USER/apps/edmft/wien2k"
edmft_root = "/home/USER/apps/edmft/eDMFT/bin"
python = "/home/USER/miniforge3/envs/edmft/bin/python"
python_bin_dir = "/home/USER/miniforge3/envs/edmft/bin"
# Optional: source site/compiler/MPI setup before every external command and PBS job.
# setup_script = "/home/USER/.config/edmft_workflow/env.sh"

# Extra environment values exported by the workflow.
[environment_extra]
OMP_NUM_THREADS = "1"
MKL_NUM_THREADS = "1"
I_MPI_HYDRA_BOOTSTRAP = "ssh"
I_MPI_FABRICS = "shm"

[commands]
dmft_copy = "dmft_copy.py"
saverage = "saverage.py"
maxent = "maxent_run.py"
x_dmft = "x_dmft.py"
wien_x = "x"

[convergence]
# This is a workflow sanity threshold, not a universal physical law.
max_dn = 0.005
outer_drift = 0.005
# If true, MaxEnt refuses to start when the checks above fail.
block_postprocess = true

[maxent]
impurity = 1
average_last = 5

# Haule MnO tutorial-style defaults. Override per material if needed.
[maxent_params]
statistics = "fermi"
Ntau = 300
L = 20.0
x0 = 0.005
bwdth = 0.004
Nw = 300
gwidth = 30.0
idg = 1
deltag = 0.004
Asteps = 4000
alpha0 = 1000
min_ratio = 0.001
iflat = 1
Nitt = 1000
Nr = 0
Nf = 40

[dos]
nomega = 200
wmin = -3.0
wmax = 1.0

[band]
nomega = 200
wmin = -6.0
wmax = 6.0
# WIEN2k template syntax:
#   @wien:fcc.klist -> $WIENROOT/SRC_templates/fcc.klist
# For a custom path, give an absolute path to your own case.klist_band.
klist_source = "@wien:fcc.klist"

[plot]
orbital_labels = ["eg", "t2g"]
cdos_labels = ["Total DOS", "Mn-d"]
dos_xmin = -3.0
dos_xmax = 1.0
akw_intensity = 0.97
# Hide line labels if you only want endpoint labels on the final figure.
drop_klabels = ["LAMBDA", "DELTA", "Z"]
# Optional display window; omit to use the entire computed real-frequency range.
# akw_ymin = -6.0
# akw_ymax = 6.0

[pbs]
qsub = "qsub"
queue = "batch"
nodes = 1
ppn = 8
mem = "16gb"
walltime = "04:00:00"

[pbs_maxent]
ppn = 8
mem = "16gb"
walltime = "04:00:00"

[pbs_dos]
ppn = 8
mem = "16gb"
walltime = "04:00:00"

[pbs_band]
ppn = 8
mem = "16gb"
walltime = "04:00:00"
