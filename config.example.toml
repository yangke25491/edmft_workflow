# Generic project-local configuration.
# Put this file at PROJECT/config.toml.
# root_dir = "." means the directory containing this config file.
#
# Scientific native inputs can be kept in PROJECT/inputs/:
#   inputs/params.dat
#   inputs/maxent_params.dat
#   inputs/CASE.klist_band
# Native files take priority over generated fallbacks.

[project]
case = "01"
root_dir = "."
scratch_dir = "dft/tmp"
dmft_scratch_dir = "dmft/tmp"

[environment]
wienroot = "/home/USER/apps/edmft/wien2k"
edmft_root = "/home/USER/apps/edmft/eDMFT/bin"
python = "/home/USER/miniforge3/envs/edmft/bin/python"
python_bin_dir = "/home/USER/miniforge3/envs/edmft/bin"
intel_root = "/opt/intel2019/compilers_and_libraries_2019.4.243"
intel_arch = "intel64"
fftw_lib = "/opt/fftw-3.3.10/lib"
ulimit_stack = "unlimited"
ulimit_core = "unlimited"

[environment_extra]
OMP_NUM_THREADS = "1"
MKL_NUM_THREADS = "1"
I_MPI_HYDRA_BOOTSTRAP = "ssh"
I_MPI_FABRICS = "shm"

[parallel]
mpi_launcher = "/opt/intel2019/compilers_and_libraries_2019.4.243/linux/mpi/intel64/bin/mpirun"
mpi_np_flag = "-np"
# Post-processing x_dmft.py installations commonly use mpi_prefix.dat2 for LAPW1.
# Keep this explicit so generated PBS files are easy to inspect.
write_mpi_prefix2 = true
wien_machines_mode = "single_node_compact"
dmft_wien_machines = false

[dft]
# This string is resolved into the generated standalone DFT PBS script.
run_command = "/home/USER/apps/edmft/wien2k/run_lapw -p -cc 0.0001 -ec 0.0001 -i 100"

# Preferred: provide PROJECT/inputs/params.dat.
# Fallback only: if that file is absent, these sections can generate params.dat.
[dmft_params]
solver = "CTQMC"
DCs = "nominal"
max_dmft_iterations = 1
max_lda_iterations = 100

[impurity0]
# Fill only if you are NOT supplying inputs/params.dat.
# exe = "ctqmc"
# U = 8.0
# J = 0.8
# beta = 100.0
# nf0 = 5.0
# M = 5000000

[dmft_prepare]
initial_sigma = "szero"
szero_args = []

[convergence]
max_dn = 0.005
outer_drift = 0.005
block_postprocess = true

[post]
# Which impurity self-energy suffix to continue, e.g. sig.inp.*.1
impurity = 1
# Average the last N selected Matsubara self-energies with official saverage.py.
average_last = 3

# maxent_params.dat is intentionally NOT hidden in config.toml.
# Preferred: PROJECT/inputs/maxent_params.dat.
# If absent, prepare-maxent writes the current upstream maxent_run.py template
# into dmft/maxent/maxent_params.dat for explicit inspection/editing.

[dos]
# prepare-dos copies the Matsubara indmfl, preserves a backup, then changes
# its second-line Matsubara flag 1 -> 0 and sets this real-frequency mesh.
nomega = 200
wmin = -3.0
wmax = 1.0

[band]
# prepare-band independently starts from the converged dmft/ snapshot,
# changes the copied indmfl flag 1 -> 0, and sets this real-frequency mesh.
nomega = 200
wmin = -6.0
wmax = 6.0
# Preferred path input: PROJECT/inputs/CASE.klist_band.
# Fallback example only:
klist_source = "@wien:fcc.klist"

[analysis]
# Low-frequency Matsubara points used for the diagnostic linear fit of ImSigma
# when reporting Z and 1/Z. Always inspect the fit/R^2 before physical use.
z_fit_points = 4

[plot]
orbital_labels = ["eg", "t2g"]
cdos_labels = ["Total DOS", "Mn-d"]
dos_xmin = -3.0
dos_xmax = 1.0
akw_intensity = 0.97
drop_klabels = ["LAMBDA", "DELTA", "Z"]

# PBS settings are used only when GENERATING standalone scripts.
# Preparation and PBS generation are intentionally separate:
#   prepare-maxent -> inspect/edit -> pbs maxent -> inspect -> qsub manually
# The generated jobs do not read config.toml and do not call workflow.py.
[pbs]
queue = "batch"
nodes = 1
ppn = 1
walltime = "04:00:00"

[pbs_dft]
job_name = "DFT"
ppn = 64
walltime = "9999:00:00"
mem = ""

[pbs_dmft]
job_name = "DMFT"
ppn = 33
walltime = "220:00:00"
mem = ""

[pbs_maxent]
job_name = "MaxEnt"
ppn = 8
walltime = "04:00:00"
mem = ""

[pbs_dos]
job_name = "DOS"
ppn = 20
walltime = "04:00:00"
mem = ""

[pbs_band]
job_name = "BAND"
ppn = 33
walltime = "04:00:00"
mem = ""
