[project]
case = "01"
# Fixed layout:
#   root_dir/dft
#   root_dir/dmft
root_dir = "/home/USER/path/to/project"
# Ordinary WIEN2k scratch. Default convention: root_dir/dft/tmp.
scratch_dir = "/home/USER/path/to/project/dft/tmp"

[environment]
wienroot = "/home/USER/apps/edmft/wien2k"
edmft_root = "/home/USER/apps/edmft/eDMFT/bin"
python = "/home/USER/miniforge3/envs/edmft/bin/python"
python_bin_dir = "/home/USER/miniforge3/envs/edmft/bin"
# Strongly recommended. This one script is sourced by foreground numerical
# commands AND every generated PBS job. Put Intel compiler/MPI/MKL/FFTW and
# conda/Python setup here.
setup_script = "/home/USER/.config/edmft_workflow/env.sh"

[environment_extra]
OMP_NUM_THREADS = "1"
MKL_NUM_THREADS = "1"
I_MPI_HYDRA_BOOTSTRAP = "ssh"
I_MPI_FABRICS = "shm"

[parallel]
# Numerical stages use MPI. Pure copying/checking/plotting is intentionally
# serial because MPI provides no benefit there.
mpi_launcher = "mpirun"
mpi_np_flag = "-np"
mpi_extra_args = []
write_mpi_prefix2 = true
# Only used when deliberately debugging a numerical stage outside PBS.
foreground_ranks = 4
# "allocation" means use the PBS allocation. Integers can cap a stage.
dft_ranks = "allocation"
dmft_ranks = "allocation"
maxent_ranks = "allocation"
dos_ranks = "allocation"
band_ranks = "allocation"
# run_dmft.py also needs WIEN2k's .machines mechanism for LAPW sections.
dmft_wien_machines = true

[commands]
dmft_copy = "dmft_copy.py"
saverage = "saverage.py"
maxent = "maxent_run.py"
x_dmft = "x_dmft.py"
wien_x = "x"

[dft]
# MANUAL checkpoint before this stage: run init_lapw in root_dir/dft.
run_command = "run_lapw -ec 0.0001 -cc 0.0001"

[dmft]
# MANUAL checkpoint before this stage: run init_dmft.py in root_dir/dmft.
# If omitted, workflow runs $PYTHON $WIEN_DMFT_ROOT/run_dmft.py.
# run_command = "/home/USER/miniforge3/envs/edmft/bin/python /home/USER/apps/edmft/eDMFT/bin/run_dmft.py"

[convergence]
max_dn = 0.005
outer_drift = 0.005
block_postprocess = true

[maxent]
impurity = 1
average_last = 5

[maxent_params]
statistics = "fermi"
Ntau = 300
L = 20.0
x0 = 0.005
bwdth = 0.004
Nw = 300
gwidth = 30.0
idg = 1
deltag = 0.004
Asteps = 4000
alpha0 = 1000
min_ratio = 0.001
iflat = 1
Nitt = 1000
Nr = 0
Nf = 40

[dos]
nomega = 200
wmin = -3.0
wmax = 1.0

[band]
nomega = 200
wmin = -6.0
wmax = 6.0
# @wien:fcc.klist -> $WIENROOT/SRC_templates/fcc.klist
klist_source = "@wien:fcc.klist"

[plot]
orbital_labels = ["eg", "t2g"]
cdos_labels = ["Total DOS", "Mn-d"]
dos_xmin = -3.0
dos_xmax = 1.0
akw_intensity = 0.97
drop_klabels = ["LAMBDA", "DELTA", "Z"]

# Production compute stages go to PBS. Fast bookkeeping, validation and plots
# stay in the foreground.
[pbs]
qsub = "qsub"
queue = "batch"
nodes = 1
ppn = 8
mem = "16gb"
walltime = "04:00:00"

[pbs_dft]
ppn = 64
mem = "220gb"
walltime = "24:00:00"

[pbs_dmft]
ppn = 64
mem = "220gb"
walltime = "48:00:00"

[pbs_maxent]
ppn = 8
mem = "16gb"
walltime = "04:00:00"

[pbs_dos]
ppn = 16
mem = "32gb"
walltime = "04:00:00"

[pbs_band]
ppn = 16
mem = "32gb"
walltime = "04:00:00"
