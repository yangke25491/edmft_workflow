[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edmft-workflow"
version = "0.1.0"
description = "Reproducible automation for WIEN2k + Haule eDMFT post-processing: convergence checks, MaxEnt, real-axis DOS, and A(k,w)."
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "yangke25491"}]
dependencies = [
  "numpy>=1.22",
  "matplotlib>=3.5",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
edmft-workflow = "edmft_workflow.cli:main"

[tool.setuptools.packages.find]
include = ["edmft_workflow*"]
